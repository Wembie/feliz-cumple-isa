name: Publicar en GitHub Pages

# Las revisiones ya corrieron en el PR (ci.yml). Aquí solo se construye, se publica y se crea el release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Nada personal sin cifrar en lo que se publica
        run: |
          if [ -d privado ]; then echo "::error::La carpeta privado/ no debe estar en el repositorio"; exit 1; fi

      - name: Construir el sitio
        run: npm run build

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  # Versión nueva en VERSION (y su sección en CHANGELOG.md) → tag vX.Y.Z + release en GitHub.
  # Si esa versión ya tiene tag, no hace nada.
  release:
    if: github.ref == 'refs/heads/main'
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear release si la versión es nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION ya existe: no hay release nuevo."
            exit 0
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro && /^\[[^]]+\]: / { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notas.md
